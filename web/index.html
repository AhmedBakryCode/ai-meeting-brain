<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="meeting_brain">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>meeting_brain</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- WebRTC Adapter for cross-browser compatibility -->
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Fix for Web Audio Autoplay Policy on Web
    // AudioContext needs to be resumed after user interaction
    window.audioContextInitialized = false;
    
    function resumeAudioContext() {
      if (window.audioContext && window.audioContext.state === 'suspended') {
        window.audioContext.resume();
      }
      window.audioContextInitialized = true;
    }
    
    // Resume on first user interaction
    ['click', 'touchstart', 'keydown'].forEach(event => {
      document.addEventListener(event, resumeAudioContext, { once: true });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
